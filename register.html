<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Создать аккаунт</h2>
            <p>Заполни данные для регистрации</p>
        </div>

        <form class="login-form">
            <div class="input-group">
                <i class="fa-solid fa-user icon"></i>
                <input type="text" placeholder="Имя пользователя" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-envelope icon"></i>
                <input type="email" placeholder="Ваш Email" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock icon"></i>
                <input type="password" id="regPassword" placeholder="Придумайте пароль" required>
                <i class="fa-solid fa-eye toggle-password" id="toggleRegPassword"></i>
            </div>

            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>

        <div class="login-footer">
            <p>Уже есть аккаунт? <a href="index.html">Войти</a></p>
        </div>
    </div>

    <script>
        const toggleRegPassword = document.querySelector('#toggleRegPassword');
        const regPassword = document.querySelector('#regPassword');

        toggleRegPassword.addEventListener('click', function () {
            const type = regPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            regPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
